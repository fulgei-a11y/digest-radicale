name: Generate Daily Radicale Digest

on:
  schedule:
    - cron: '0 5 * * *'  # Ogni mattina alle 05:00 UTC
  workflow_dispatch:
    inputs:
      digest_date:
        description: 'Data da generare (AAAA-MM-GG). Vuoto = automatico'
        required: false
        default: ''
      backfill_days:
        description: 'Quanti giorni indietro recuperare se mancano'
        required: false
        default: '7'
      audio_recordings:
        description: 'Quante registrazioni ascoltare (0 = nessuna)'
        required: false
        default: '0'
      digest_from:
        description: 'Recupero di un periodo: dal giorno (AAAA-MM-GG). Vuoto = no'
        required: false
        default: ''
      digest_to:
        description: 'Recupero di un periodo: al giorno (AAAA-MM-GG). Vuoto = fino a 2 giorni fa'
        required: false
        default: ''
      max_per_run:
        description: 'Quanti giorni generare al massimo in questa esecuzione'
        required: false
        default: '2'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Installa ffmpeg (per l'ascolto dell'audio)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Controlla che lo script sia completo
        run: |
          echo "Righe di build_digest.py: $(wc -l < build_digest.py)"
          if ! grep -q "SCRIPT_VERSION = 4" build_digest.py || ! tail -3 build_digest.py | grep -q "main()"; then
            echo "❌ build_digest.py è incompleto o vecchio: ricaricalo per intero (deve finire con main())."
            exit 1
          fi

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Esegui generazione Digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DIGEST_DATE: ${{ github.event.inputs.digest_date }}
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '7' }}
          AUDIO_MAX_RECORDINGS: ${{ github.event.inputs.audio_recordings || '0' }}
          AUDIO_MAX_MINUTES: '60'
          MAX_PER_RUN: ${{ github.event.inputs.max_per_run || '2' }}
          DIGEST_FROM: ${{ github.event.inputs.digest_from }}
          DIGEST_TO: ${{ github.event.inputs.digest_to }}
        run: python build_digest.py

      - name: Salva e carica le modifiche sul repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          echo "File modificati:"
          git status --short digests/
          if git diff --cached --quiet; then
            echo "Nessun digest nuovo da salvare."
            exit 0
          fi
          git commit -m "Automated digest update"
          git pull --rebase
          git push
          echo "✅ Digest pubblicati. Il sito si aggiorna in 1-2 minuti."
