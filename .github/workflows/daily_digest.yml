name: Generate Daily Radicale Digest

on:
  schedule:
    - cron: '0 5 * * *'  # Ogni mattina alle 05:00 UTC
  workflow_dispatch:
    inputs:
      digest_date:
        description: 'Data da generare (AAAA-MM-GG). Vuoto = automatico'
        required: false
        default: ''
      backfill_days:
        description: 'Quanti giorni indietro recuperare se mancano'
        required: false
        default: '7'
      audio_recordings:
        description: 'Quante registrazioni ascoltare (0 = nessuna)'
        required: false
        default: '2'
      digest_from:
        description: 'Recupero di un periodo: dal giorno (AAAA-MM-GG). Vuoto = no'
        required: false
        default: ''
      digest_to:
        description: 'Recupero di un periodo: al giorno (AAAA-MM-GG). Vuoto = fino a ieri'
        required: false
        default: ''
      max_per_run:
        description: 'Quanti giorni generare al massimo in questa esecuzione'
        required: false
        default: '2'

# due esecuzioni insieme (una manuale durante quella programmata) si accodano invece di scontrarsi
concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      issues: write      # per aprire la segnalazione automatica se qualcosa va storto
    env:
      DAYS_LAG: '1'      # 1 = ogni mattina il digest di ieri
      DIGEST_STATUS_FILE: ${{ github.workspace }}/digest_status.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Installa ffmpeg (per l'ascolto dell'audio)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Controlla che lo script sia completo
        run: |
          echo "Righe di build_digest.py: $(wc -l < build_digest.py)"
          if ! grep -q "SCRIPT_VERSION = 5" build_digest.py || ! tail -3 build_digest.py | grep -q "main()"; then
            echo "❌ build_digest.py è incompleto o vecchio: ricaricalo per intero (deve finire con main())."
            exit 1
          fi
          for f in build_digest.py check_health.py tools/build_audio.py; do
            python -m py_compile "$f" || { echo "❌ $f non è valido: ricaricalo per intero."; exit 1; }
            tail -3 "$f" | grep -q "main()" || { echo "❌ $f è incompleto: ricaricalo per intero."; exit 1; }
          done

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Esegui generazione Digest
        id: gen
        continue-on-error: true   # si salva comunque quello che è riuscito; l'esito lo valuta il controllo finale
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DIGEST_DATE: ${{ github.event.inputs.digest_date }}
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '7' }}
          AUDIO_MAX_RECORDINGS: ${{ github.event.inputs.audio_recordings || '2' }}
          AUDIO_MAX_MINUTES: '60'
          MAX_PER_RUN: ${{ github.event.inputs.max_per_run || '2' }}
          DIGEST_FROM: ${{ github.event.inputs.digest_from }}
          DIGEST_TO: ${{ github.event.inputs.digest_to }}
        run: python build_digest.py

      # Se l'MP3 non riesce, il digest scritto viene pubblicato lo stesso (e arriva l'avviso)
      - name: Genera l'audio MP3 con la voce Paola
        id: audio
        continue-on-error: true
        run: python tools/build_audio.py --auto 3

      - name: Salva e carica le modifiche sul repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A digests/ d/ audio/ 2>/dev/null || git add digests/
          echo "File modificati:"
          git status --short digests/ d/ audio/
          if git diff --cached --quiet; then
            echo "Nessun digest nuovo da salvare."
            exit 0
          fi
          git commit -m "Automated digest update"
          git pull --rebase
          git push
          echo "✅ Digest pubblicati. Il sito si aggiorna in 1-2 minuti."

      - name: Controllo dell'esito
        id: health
        if: always()
        env:
          GEN_OUTCOME: ${{ steps.gen.outcome }}
          AUDIO_OUTCOME: ${{ steps.audio.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python check_health.py

      - name: Avviso se qualcosa non va
        if: always() && steps.health.outputs.problems == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create digest-errore --color d6332f --description "Aggiornamento automatico non riuscito" 2>/dev/null || true
          n=$(gh issue list --label digest-errore --state open --json number -q '.[0].number')
          { echo "@${{ github.repository_owner }}"; echo; cat health.md; } > body.md
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file body.md
          else
            gh issue create --title "⚠️ Digest Radio Radicale: aggiornamento non riuscito" \
              --label digest-errore --body-file body.md
          fi
          echo "::error::Aggiornamento non riuscito: vedi la segnalazione nella scheda Issues."
          exit 1

      - name: Chiudi l'avviso quando tutto torna a posto
        if: always() && steps.health.outputs.problems == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label digest-errore --state open --json number -q '.[].number'); do
            gh issue close "$n" --comment "$(cat health.md)"
          done
