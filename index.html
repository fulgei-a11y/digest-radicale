<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<title>Digest Radio Radicale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>window.marked || document.write('<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"><\/script>')</script>
<style>
  :root {
    --bg:#f6f4ef; --surface:#ffffff; --surface-2:#efece5; --fg:#16181d; --muted:#6b6f76;
    --line:#e3dfd6; --accent:#d6332f; --accent-soft:#fbe9e7; --link:#b5241f;
    --shadow:0 1px 2px rgba(20,20,20,.04), 0 8px 24px rgba(20,20,20,.06);
    --radius:18px;
    --serif:"Fraunces", Georgia, "Times New Roman", serif;
    --sans:"Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0f1115; --surface:#171a20; --surface-2:#1f232b; --fg:#ecebe7; --muted:#9a9ea6;
      --line:#2a2f38; --accent:#ff5a4f; --accent-soft:#2a1716; --link:#ff8a80;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16.5px/1.7 var(--sans);
         -webkit-font-smoothing:antialiased; }

  /* Barra di avanzamento della lettura */
  #progress { position:fixed; top:0; left:0; height:3px; width:0; background:var(--accent);
              z-index:30; transition:width .1s linear; }

  /* Testata */
  .topbar { position:sticky; top:0; z-index:20; backdrop-filter:saturate(1.4) blur(14px);
            -webkit-backdrop-filter:saturate(1.4) blur(14px);
            background:color-mix(in srgb, var(--bg) 82%, transparent);
            border-bottom:1px solid var(--line); }
  .topbar-inner { max-width:780px; margin:0 auto; padding:12px 16px;
                  display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:-.01em; }
  .brand small { display:block; font-weight:500; color:var(--muted); font-size:.75rem; letter-spacing:.08em;
                 text-transform:uppercase; line-height:1.2; }
  .onair { width:10px; height:10px; border-radius:50%; background:var(--accent); flex:none;
           box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent);
           animation:pulse 2.2s infinite; }
  @keyframes pulse { 70% { box-shadow:0 0 0 10px transparent; } 100% { box-shadow:0 0 0 0 transparent; } }
  .icon-btn { display:inline-flex; align-items:center; gap:8px; border:0; cursor:pointer;
              background:var(--fg); color:var(--bg); font:600 .9rem var(--sans);
              padding:9px 14px; border-radius:999px; transition:transform .15s, opacity .15s; }
  .icon-btn:active { transform:scale(.96); }
  .icon-btn:disabled { opacity:.35; cursor:default; }
  .icon-btn svg { width:18px; height:18px; }

  main { max-width:780px; margin:0 auto; padding:20px 16px 80px; }

  /* Navigatore delle date */
  .datenav { display:flex; align-items:center; gap:8px; background:var(--surface);
             border:1px solid var(--line); border-radius:999px; padding:6px; box-shadow:var(--shadow); }
  .datenav button { flex:none; width:42px; height:42px; border-radius:50%; border:0; cursor:pointer;
                    background:var(--surface-2); color:var(--fg); display:grid; place-items:center;
                    transition:background .15s, transform .15s; }
  .datenav button:hover:not(:disabled) { background:var(--accent-soft); color:var(--accent); }
  .datenav button:active:not(:disabled) { transform:scale(.92); }
  .datenav button:disabled { opacity:.3; cursor:default; }
  .datenav button svg { width:20px; height:20px; }
  .datenav select { flex:1; min-width:0; appearance:none; -webkit-appearance:none; border:0; background:transparent;
                    color:var(--fg); font:600 1rem var(--sans); text-align:center; text-align-last:center;
                    padding:8px 4px; cursor:pointer; }
  .datenav select:focus { outline:none; }

  /* Articolo */
  .hero { margin:28px 4px 8px; }
  .kicker { display:inline-flex; align-items:center; gap:8px; color:var(--accent); font-weight:700;
            font-size:.78rem; letter-spacing:.12em; text-transform:uppercase; }
  #content h1 { font-family:var(--serif); font-weight:700; font-size:clamp(2rem, 7vw, 2.9rem);
                line-height:1.08; letter-spacing:-.02em; margin:.3em 0 .25em; }
  #content h1 + p em, #content h1 + p { color:var(--muted); font-size:1.05rem; }
  #content h2 { font-family:var(--serif); font-weight:700; font-size:1.45rem; line-height:1.2;
                letter-spacing:-.01em; margin:0 0 .7em; display:flex; gap:12px; align-items:flex-start; }
  #content h2 .num { flex:none; display:grid; place-items:center; min-width:34px; height:34px; padding:0 8px;
                     border-radius:10px; background:var(--accent-soft); color:var(--accent);
                     font:700 .95rem var(--sans); margin-top:1px; }
  #content h3 { font-size:1.08rem; margin:1.4em 0 .4em; }
  #content p { margin:.75em 0; }
  #content ul, #content ol { padding-left:1.25em; }
  #content li { margin:.35em 0; }
  #content li::marker { color:var(--accent); }
  #content a { color:var(--link); text-decoration:underline; text-decoration-thickness:1px;
               text-underline-offset:3px; word-break:break-word; }
  #content a:hover { text-decoration-thickness:2px; }
  #content blockquote { margin:1em 0; padding:.2em 1em; border-left:3px solid var(--accent);
                        color:var(--muted); font-style:italic; }
  #content hr { border:0; border-top:1px solid var(--line); margin:2em 0; }
  #content table { width:100%; border-collapse:collapse; font-size:.93rem; display:block; overflow-x:auto; }
  #content th, #content td { border-bottom:1px solid var(--line); padding:8px 10px; text-align:left; }

  /* Etichette tipo "Per capire:" a inizio paragrafo */
  #content p > strong:first-child { display:block; font:700 .74rem var(--sans); letter-spacing:.1em;
                                    text-transform:uppercase; color:var(--accent); margin-bottom:2px; }

  /* Ogni sezione diventa una scheda */
  .block { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
           padding:22px 20px; margin:18px 0; box-shadow:var(--shadow); }
  .block.brief { background:linear-gradient(180deg, var(--accent-soft), var(--surface) 70%);
                 border-color:color-mix(in srgb, var(--accent) 25%, var(--line)); }
  .block.brief ul { list-style:none; padding:0; }
  .block.brief li { position:relative; padding-left:22px; }
  .block.brief li::before { content:""; position:absolute; left:2px; top:.7em; width:8px; height:8px;
                            border-radius:50%; background:var(--accent); }
  .block.quiet { background:transparent; box-shadow:none; border-style:dashed; }

  /* Fonti */
  #content .sources ol { counter-reset:src; list-style:none; padding:0; }
  .sources li { counter-increment:src; display:flex; gap:12px; align-items:baseline;
                padding:10px 0; border-bottom:1px solid var(--line); margin:0; }
  .sources li:last-child { border-bottom:0; }
  .sources li::before { content:counter(src); flex:none; min-width:26px; height:26px; border-radius:8px;
                        display:grid; place-items:center; background:var(--surface-2); color:var(--muted);
                        font:700 .78rem var(--sans); }
  .sources .host { display:block; color:var(--muted); font-size:.82rem; }
  .sources .note { color:var(--muted); font-size:.9rem; margin-top:-.4em; }

  /* Caricamento */
  .skeleton { margin-top:28px; }
  .skeleton div { height:16px; border-radius:8px; margin:12px 0;
                  background:linear-gradient(90deg, var(--surface-2) 25%, var(--line) 50%, var(--surface-2) 75%);
                  background-size:200% 100%; animation:shimmer 1.3s infinite; }
  .skeleton .t { height:42px; width:80%; margin-bottom:22px; }
  @keyframes shimmer { to { background-position:-200% 0; } }
  .msg { text-align:center; color:var(--muted); padding:48px 16px; }

  /* Archivio */
  #archive { margin-top:48px; }
  #archive h2 { font-family:var(--serif); font-size:1.4rem; margin:0 0 4px; }
  #archive p { color:var(--muted); margin:0 0 16px; font-size:.92rem; }
  .days { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:10px;
          list-style:none; padding:0; margin:0; }
  .days a { display:block; text-decoration:none; color:var(--fg); background:var(--surface);
            border:1px solid var(--line); border-radius:14px; padding:12px 14px;
            transition:transform .15s, border-color .15s, box-shadow .15s; }
  .days a:hover { transform:translateY(-2px); border-color:var(--accent); box-shadow:var(--shadow); }
  .days .wd { display:block; font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  .days .dt { display:block; font-weight:700; font-size:1.02rem; }
  .days a.current { background:var(--fg); color:var(--bg); border-color:var(--fg); }
  .days a.current .wd { color:inherit; opacity:.7; }

  /* Torna su */
  #totop { position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom)); width:46px; height:46px;
           border-radius:50%; border:0; cursor:pointer; background:var(--accent); color:#fff;
           box-shadow:var(--shadow); display:grid; place-items:center; opacity:0; pointer-events:none;
           transform:translateY(10px); transition:opacity .2s, transform .2s; }
  #totop.show { opacity:1; pointer-events:auto; transform:none; }
  #totop svg { width:22px; height:22px; }

  footer { text-align:center; color:var(--muted); font-size:.8rem; margin-top:40px; }

  /* Temi */
  .toc { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
         padding:18px 20px; margin:18px 0; box-shadow:var(--shadow); }
  .toc h2 { font-family:var(--serif); font-size:1.25rem; margin:0 0 4px; }
  .toc .area { font:700 .72rem var(--sans); letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin:14px 0 4px; }
  .toc ol { margin:0; padding-left:1.2em; }
  .toc li { margin:4px 0; }
  .toc a { color:var(--fg); text-decoration:none; }
  .toc a:hover { color:var(--link); text-decoration:underline; }
  .toc .tools { display:flex; gap:8px; margin-top:12px; }
  .chipbtn { border:1px solid var(--line); background:var(--surface-2); color:var(--fg); border-radius:999px;
             padding:6px 12px; font:600 .85rem var(--sans); cursor:pointer; }
  details.theme { border-top:1px solid var(--line); padding:4px 0; scroll-margin-top:80px; }
  details.theme:first-of-type { border-top:0; }
  details.theme > summary { list-style:none; cursor:pointer; padding:12px 30px 12px 0; position:relative; }
  details.theme > summary::-webkit-details-marker { display:none; }
  details.theme > summary::after { content:"+"; position:absolute; right:4px; top:10px; font:600 1.4rem var(--sans); color:var(--accent); }
  details.theme[open] > summary::after { content:"–"; }
  details.theme > summary .t { display:block; font-family:var(--serif); font-weight:700; font-size:1.12rem; line-height:1.3; }
  details.theme > summary .s { display:block; color:var(--muted); font-size:.95rem; margin-top:3px; }
  details.theme[open] > summary .s { display:none; }
  details.theme .body { padding:0 0 12px; }
  .block.area > h2 { font-size:.8rem !important; font-family:var(--sans) !important; letter-spacing:.12em;
                     text-transform:uppercase; color:var(--accent); margin-bottom:4px !important; }
  #archive .tabs { display:flex; gap:8px; margin:0 0 14px; }
  #archive .tabs button.on { background:var(--fg); color:var(--bg); border-color:var(--fg); }
  #themeSearch { width:100%; font:1rem var(--sans); padding:10px 14px; border-radius:999px; border:1px solid var(--line);
                 background:var(--surface); color:var(--fg); margin-bottom:12px; }
  .tres { list-style:none; padding:0; margin:0; }
  .tres li { padding:10px 0; border-bottom:1px solid var(--line); }
  .tres a { text-decoration:none; color:var(--fg); }
  .tres .d { font:600 .78rem var(--sans); color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .tres .tt { display:block; font-weight:700; }
  .tres .ss { display:block; color:var(--muted); font-size:.92rem; }
  .tres mark { background:var(--accent-soft); color:inherit; border-radius:3px; }

  /* Pulsanti della testata */
  .actions { display:flex; gap:8px; }
  .icon-btn.ghost { background:var(--surface); color:var(--fg); border:1px solid var(--line); }

  /* Lettura vocale */
  .speaking { background:color-mix(in srgb, var(--accent) 14%, transparent); border-radius:8px;
              box-shadow:0 0 0 6px color-mix(in srgb, var(--accent) 14%, transparent);
              transition:background .2s, box-shadow .2s; }
  #player { position:fixed; left:50%; bottom:calc(14px + env(safe-area-inset-bottom)); z-index:25;
            transform:translate(-50%, 140%); transition:transform .25s ease;
            width:min(760px, calc(100% - 24px)); background:var(--fg); color:var(--bg);
            border-radius:22px; padding:10px 12px; box-shadow:0 12px 40px rgba(0,0,0,.28); }
  #player.open { transform:translate(-50%, 0); }
  #player .row { display:flex; align-items:center; gap:8px; }
  #player button { flex:none; width:44px; height:44px; border-radius:50%; border:0; cursor:pointer;
                   display:grid; place-items:center; background:color-mix(in srgb, var(--bg) 14%, transparent);
                   color:var(--bg); }
  #player button.main { background:var(--accent); color:#fff; }
  #player button svg { width:20px; height:20px; }
  #player .info { flex:1; min-width:0; }
  #player .now { font-weight:600; font-size:.88rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #player .bar { height:4px; border-radius:2px; background:color-mix(in srgb, var(--bg) 20%, transparent);
                 margin-top:6px; overflow:hidden; }
  #player .bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .3s; }
  #player .opts { display:flex; gap:8px; margin-top:8px; }
  #player select { min-width:0; flex:1; font:500 .82rem var(--sans); color:var(--bg);
                   background:color-mix(in srgb, var(--bg) 12%, transparent); border:0; border-radius:10px;
                   padding:7px 8px; }
  #player select option { color:#000; }
  #player .opts select.speed { flex:0 0 84px; }
  #player .hint { font-size:.78rem; opacity:.75; margin-top:6px; }
  body.player-open #totop { bottom:calc(150px + env(safe-area-inset-bottom)); }
  body.player-open main { padding-bottom:180px; }

  @media (min-width:640px) {
    body { font-size:17px; }
    .block { padding:28px 30px; }
    main { padding-top:28px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation:none !important; transition:none !important; }
    html { scroll-behavior:auto; }
  }

  /* Stampa e PDF */
  @media print {
    @page { margin:18mm 16mm; }
    :root { --bg:#fff; --surface:#fff; --fg:#000; --muted:#444; --line:#ccc; --accent:#000; --link:#000; --accent-soft:#fff; }
    body { font:11pt/1.5 Georgia, "Times New Roman", serif; background:#fff; color:#000; }
    .topbar, .datenav, #archive, #totop, #progress, footer, #player { display:none !important; }
    .speaking { background:none; box-shadow:none; }
    .toc .tools, details.theme > summary::after { display:none !important; }
    details.theme > summary .s { display:none; }
    main { max-width:none; padding:0; }
    .hero { margin-top:0; }
    .block, .block.brief { background:none; border:0; box-shadow:none; padding:0; margin:0 0 14pt; }
    #content h1 { font-size:22pt; }
    #content h2 { font-size:14pt; break-after:avoid; page-break-after:avoid; }
    #content h2 .num { background:none; padding:0; min-width:0; height:auto; }
    #content p, #content li { orphans:3; widows:3; }
    #content a { text-decoration:none; }
    #content a[href^="http"]::after { content:" (" attr(href) ")"; font-size:8pt; color:#555; word-break:break-all; }
    .print-footer { display:block !important; margin-top:20pt; font-size:9pt; color:#555;
                    border-top:1px solid #ccc; padding-top:6pt; }
  }
</style>
</head>
<body>
<div id="progress"></div>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="onair" aria-hidden="true"></span>
      <div>Digest<small>Radio Radicale</small></div>
    </div>
    <div class="actions">
      <button id="listen" class="icon-btn ghost" disabled aria-label="Ascolta il digest">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
        Ascolta
      </button>
      <button id="print" class="icon-btn" disabled aria-label="Stampa o salva in PDF">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="6" y="14" width="12" height="7" rx="1"/><path d="M6 18H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/></svg>
        PDF
      </button>
    </div>
  </div>
</header>

<main>
  <nav class="datenav" aria-label="Scegli il giorno">
    <button id="prev" aria-label="Giorno precedente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <select id="picker" aria-label="Data del digest"></select>
    <button id="next" aria-label="Giorno successivo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </nav>

  <div class="hero"><span class="kicker" id="kicker">Caricamento</span></div>
  <article id="content">
    <div class="skeleton"><div class="t"></div><div></div><div></div><div style="width:70%"></div></div>
  </article>
  <p class="print-footer" hidden>Digest generato automaticamente da fonti di Radio Radicale.</p>

  <section id="archive" hidden>
    <h2>Archivio</h2>
    <div class="tabs">
      <button class="chipbtn on" id="tabDays" type="button">Per giorno</button>
      <button class="chipbtn" id="tabThemes" type="button">Per tema</button>
    </div>
    <div id="paneDays">
      <p>Tutti i giorni disponibili.</p>
      <ul class="days" id="days"></ul>
    </div>
    <div id="paneThemes" hidden>
      <input id="themeSearch" type="search" placeholder="Cerca un tema in tutti i giorni (es. legge elettorale, carcere)" autocomplete="off">
      <ul class="tres" id="themeResults"></ul>
    </div>
  </section>

  <footer>Sintesi generata automaticamente. Verifica sempre sulle fonti indicate.</footer>
</main>

<div id="player" role="region" aria-label="Lettura vocale">
  <div class="row">
    <button id="pPrev" aria-label="Paragrafo precedente">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12L18 6v12z"/></svg>
    </button>
    <button id="pPlay" class="main" aria-label="Riproduci o pausa">
      <svg id="icoPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg id="icoPause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <button id="pNext" aria-label="Paragrafo successivo">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
    </button>
    <div class="info">
      <div class="now" id="pNow">Pronto</div>
      <div class="bar"><i id="pBar"></i></div>
    </div>
    <button id="pClose" aria-label="Chiudi la lettura">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="opts">
    <select id="pVoice" aria-label="Voce"></select>
    <select id="pRate" class="speed" aria-label="Velocità">
      <option value="0.85">0.85×</option><option value="1" selected>1×</option>
      <option value="1.15">1.15×</option><option value="1.3">1.3×</option><option value="1.5">1.5×</option>
    </select>
  </div>
  <div class="hint" id="pHint" hidden></div>
</div>

<button id="totop" aria-label="Torna su">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
</button>

<script>
  const $ = id => document.getElementById(id);
  const picker = $('picker'), content = $('content'), prevBtn = $('prev'), nextBtn = $('next');
  const daysList = $('days'), printBtn = $('print'), kicker = $('kicker');
  const SKELETON = content.innerHTML;
  let list = [];

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  function longDate(iso) {
    const d = new Date(iso + 'T12:00:00');
    return isNaN(d) ? iso : d.toLocaleDateString('it-IT',
      { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  }
  function weekday(iso) {
    const d = new Date(iso + 'T12:00:00');
    return isNaN(d) ? '' : d.toLocaleDateString('it-IT', { weekday:'long' });
  }

  function renderSources(sources) {
    if (!Array.isArray(sources) || !sources.length) return '';
    const items = sources.filter(s => s && /^https?:\/\//.test(s.url)).map(s => {
      let host = '';
      try { host = new URL(s.url).hostname.replace(/^www\./, ''); } catch (e) {}
      const title = s.title && s.title !== host ? s.title : host;
      return '<li><div><a href="' + esc(s.url) + '">' + esc(title) + '</a>' +
             (host && title !== host ? '<span class="host">' + esc(host) + '</span>' : '') + '</div></li>';
    }).join('');
    return '<h2>Fonti consultate per i riscontri</h2>' +
           '<p class="note">Pagine aperte o trovate durante la preparazione del digest.</p><ol>' + items + '</ol>';
  }

  // Raggruppa ogni titolo di sezione e il suo contenuto in una scheda
  function buildBlocks(root) {
    const nodes = Array.from(root.childNodes);
    const frag = document.createDocumentFragment();
    let current = null;
    for (const n of nodes) {
      if (n.nodeType === 1 && n.tagName === 'H2') {
        current = document.createElement('section');
        current.className = 'block';
        const t = n.textContent.trim().toLowerCase();
        if (t.startsWith('in breve')) current.classList.add('brief');
        if (t.startsWith('cosa non') || t.startsWith('glossario')) current.classList.add('quiet');
        if (t.startsWith('fonti')) current.classList.add('sources');
        // "1. Titolo" diventa un numero in evidenza
        const m = n.textContent.match(/^\s*(\d+)[.)]\s*(.*)$/);
        if (m) n.innerHTML = '<span class="num">' + m[1] + '</span><span>' + esc(m[2]) + '</span>';
        frag.appendChild(current);
      }
      (current || frag).appendChild(n);
    }
    root.innerHTML = '';
    root.appendChild(frag);
    buildThemes(root);

    // Etichette "Per capire:" → toglie i due punti, ora che l'etichetta va a capo
    root.querySelectorAll('p > strong:first-child').forEach(s => {
      if (s.previousSibling && s.previousSibling.textContent.trim()) return;
      s.textContent = s.textContent.replace(/\s*:\s*$/, '');
      const next = s.nextSibling;
      if (next && next.nodeType === 3) next.textContent = next.textContent.replace(/^\s*:\s*/, '');
    });
  }

  function slugify(t) {
    return t.normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
            .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);
  }

  // Ogni "### tema" dentro un'area diventa una scheda apribile, con la frase "In una riga" come anteprima
  function buildThemes(root) {
    const toc = [];
    root.querySelectorAll('section.block').forEach(sec => {
      const h2 = sec.querySelector(':scope > h2');
      const area = h2 ? h2.textContent.trim() : '';
      if (/^(in breve|le altre|glossario|cosa non|fonti)/i.test(area)) return;
      const h3s = sec.querySelectorAll(':scope > h3');
      if (!h3s.length) return;
      sec.classList.add('area');
      const entry = { area, themes: [] };
      h3s.forEach(h3 => {
        const det = document.createElement('details');
        det.className = 'theme';
        const title = h3.textContent.trim();
        det.id = slugify(title);
        const body = document.createElement('div');
        body.className = 'body';
        let n = h3.nextSibling, summary = '';
        while (n && !(n.nodeType === 1 && /^H[23]$/.test(n.tagName))) {
          const next = n.nextSibling;
          if (n.nodeType === 1 && !summary && /^in una riga/i.test(n.textContent.trim())) {
            summary = n.textContent.replace(/^\s*in una riga\s*:?\s*/i, '').replace(/\s*ascolta\s*$/i, '').trim();
          }
          body.appendChild(n);
          n = next;
        }
        det.innerHTML = '<summary><span class="t">' + esc(title) + '</span>' +
                        (summary ? '<span class="s">' + esc(summary) + '</span>' : '') + '</summary>';
        det.appendChild(body);
        h3.replaceWith(det);
        entry.themes.push({ id: det.id, title });
      });
      toc.push(entry);
    });
    if (!toc.length) return;
    const total = toc.reduce((a, e) => a + e.themes.length, 0);
    const box = document.createElement('nav');
    box.className = 'toc';
    box.innerHTML = '<h2>I temi della giornata</h2><p class="note" style="margin:0;color:var(--muted)">' + total +
      ' temi. Tocca un tema per aprirlo.</p>' +
      toc.map(e => '<div class="area">' + esc(e.area) + '</div><ol>' +
        e.themes.map(t => '<li><a href="#" data-theme="' + t.id + '">' + esc(t.title) + '</a></li>').join('') + '</ol>').join('') +
      '<div class="tools"><button class="chipbtn" type="button" data-all="1">Apri tutti</button>' +
      '<button class="chipbtn" type="button" data-all="0">Chiudi tutti</button></div>';
    const brief = root.querySelector('section.brief');
    (brief ? brief.after(box) : root.prepend(box));
    box.addEventListener('click', ev => {
      const a = ev.target.closest('[data-theme]');
      if (a) { ev.preventDefault(); openTheme(a.dataset.theme); }
      const b = ev.target.closest('[data-all]');
      if (b) root.querySelectorAll('details.theme').forEach(d => d.open = b.dataset.all === '1');
    });
  }

  function openTheme(id) {
    const det = document.getElementById(id);
    if (!det) return;
    det.open = true;
    det.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function updateNav(date) {
    const i = list.findIndex(x => x.date === date);
    picker.value = date;
    prevBtn.disabled = i >= list.length - 1;
    nextBtn.disabled = i <= 0;
    daysList.querySelectorAll('a').forEach(a => a.classList.toggle('current', a.dataset.date === date));
  }

  async function loadDigest(date, themeId) {
    updateNav(date);
    if (typeof stopReading === 'function') stopReading(true);
    printBtn.disabled = true;
    listenBtn.disabled = true;
    kicker.textContent = longDate(date);
    content.innerHTML = SKELETON;
    try {
      const r = await fetch('digests/' + date + '.json', { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      // salta eventuali appunti di lavoro del modello finiti prima del digest
      let md = d.markdown || '';
      const start = md.search(/^# Radio Radicale|^## In breve/m);
      if (start > 0) md = md.slice(start);
      content.innerHTML = marked.parse(md) + renderSources(d.sources);
      buildBlocks(content);
      content.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
      document.title = 'Digest Radio Radicale ' + (d.label || date);
      printBtn.disabled = false;
      listenBtn.disabled = false;
      const h = '#' + date + (themeId ? '/' + themeId : '');
      if (location.hash !== h) history.pushState(null, '', h);
      if (themeId) setTimeout(() => openTheme(themeId), 50);
      else window.scrollTo({ top: 0 });
    } catch (e) {
      content.innerHTML = '<p class="msg">Impossibile caricare il digest del ' + esc(longDate(date)) +
                          ' (' + esc(e.message) + ').</p>';
    }
  }

  function step(delta) {
    const i = list.findIndex(x => x.date === picker.value) + delta;
    if (i >= 0 && i < list.length) loadDigest(list[i].date);
  }

  async function init() {
    try {
      const r = await fetch('digests/index.json', { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      list = (await r.json()).sort((a, b) => b.date.localeCompare(a.date));
      if (!list.length) {
        kicker.textContent = '';
        content.innerHTML = '<p class="msg">Nessun digest disponibile.</p>';
        return;
      }
      for (const item of list) {
        const o = document.createElement('option');
        o.value = item.date;
        o.textContent = longDate(item.date);
        picker.appendChild(o);

        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = '#' + item.date;
        a.dataset.date = item.date;
        a.innerHTML = '<span class="wd">' + esc(weekday(item.date)) + '</span>' +
                      '<span class="dt">' + esc(item.label || item.date) + '</span>';
        a.onclick = ev => { ev.preventDefault(); loadDigest(item.date); };
        li.appendChild(a);
        daysList.appendChild(li);
      }
      $('archive').hidden = false;

      picker.onchange = () => loadDigest(picker.value);
      prevBtn.onclick = () => step(1);
      nextBtn.onclick = () => step(-1);
      window.onpopstate = () => {
        const [h, t] = location.hash.slice(1).split('/');
        if (list.some(x => x.date === h)) loadDigest(h, t);
      };
      setupThemeArchive();

      const [wanted, wantedTheme] = location.hash.slice(1).split('/');
      if (list.some(x => x.date === wanted)) loadDigest(wanted, wantedTheme);
      else loadDigest(list[0].date);
    } catch (e) {
      kicker.textContent = '';
      content.innerHTML = '<p class="msg">Impossibile leggere digests/index.json (' + esc(e.message) + ').</p>';
    }
  }

  printBtn.onclick = () => window.print();
  window.addEventListener('beforeprint', () => content.querySelectorAll('details.theme').forEach(d => d.open = true));

  /* Archivio per tema: tutti i temi di tutti i giorni (digests/themes.json) */
  let allThemes = null;
  function setupThemeArchive() {
    const tabD = $('tabDays'), tabT = $('tabThemes');
    const show = which => {
      tabD.classList.toggle('on', which === 'd'); tabT.classList.toggle('on', which === 't');
      $('paneDays').hidden = which !== 'd'; $('paneThemes').hidden = which !== 't';
      if (which === 't') loadThemes();
    };
    tabD.onclick = () => show('d');
    tabT.onclick = () => show('t');
    let timer;
    $('themeSearch').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(renderThemes, 150); });
  }
  async function loadThemes() {
    if (allThemes) return renderThemes();
    try {
      const r = await fetch('digests/themes.json', { cache: 'no-store' });
      allThemes = r.ok ? await r.json() : [];
    } catch (e) { allThemes = []; }
    renderThemes();
  }
  function renderThemes() {
    const q = $('themeSearch').value.trim().toLowerCase();
    const words = q.split(/\s+/).filter(Boolean);
    const hit = t => words.every(w => (t.title + ' ' + t.summary + ' ' + t.area).toLowerCase().includes(w));
    const res = (allThemes || []).filter(hit).slice(0, 300);
    const mark = s => { let out = esc(s); words.forEach(w => { out = out.replace(new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<mark>$1</mark>'); }); return out; };
    $('themeResults').innerHTML = !allThemes || !allThemes.length
      ? '<li class="msg">L\'archivio dei temi si crea alla prossima esecuzione automatica.</li>'
      : (res.length ? res.map(t => '<li><a href="#' + t.date + '/' + t.id + '" data-d="' + t.date + '" data-t="' + t.id + '">' +
          '<span class="d">' + esc(longDate(t.date)) + ' · ' + esc(t.area) + '</span>' +
          '<span class="tt">' + mark(t.title) + '</span>' + (t.summary ? '<span class="ss">' + mark(t.summary) + '</span>' : '') +
          '</a></li>').join('') : '<li class="msg">Nessun tema trovato.</li>');
    $('themeResults').querySelectorAll('a[data-d]').forEach(a => a.onclick = ev => {
      ev.preventDefault(); loadDigest(a.dataset.d, a.dataset.t); });
  }

  /* ------------------------------------------------------------------ */
  /*  Lettura vocale (voce preferita: Paola)                             */
  /* ------------------------------------------------------------------ */
  const synth = window.speechSynthesis;
  const PREFERRED = 'paola';
  const reader = { chunks: [], i: 0, playing: false, voice: null, rate: 1 };
  const listenBtn = $('listen'), player = $('player');

  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  function italianVoices() {
    return (synth ? synth.getVoices() : []).filter(v => /^it([-_]|$)/i.test(v.lang));
  }

  function fillVoices() {
    const sel = $('pVoice'), hint = $('pHint');
    const voices = italianVoices();
    sel.innerHTML = '';
    if (!voices.length) {
      hint.hidden = false;
      hint.textContent = 'Nessuna voce italiana installata. Su Android: Impostazioni › Sintesi vocale; su iPhone: Impostazioni › Accessibilità › Contenuto letto ad alta voce › Voci › Italiano › Paola.';
      return;
    }
    voices.forEach(v => {
      const o = document.createElement('option');
      o.value = v.name;
      o.textContent = v.name.replace(/^Microsoft |\(Italian.*\)|Online|Natural/gi, '').trim() || v.name;
      sel.appendChild(o);
    });
    const saved = load('voice');
    const paola = voices.find(v => v.name.toLowerCase().includes(PREFERRED));
    const pick = voices.find(v => v.name === saved) || paola ||
                 voices.find(v => /natural|enhanced|premium/i.test(v.name)) || voices[0];
    sel.value = pick.name;
    reader.voice = pick;
    hint.hidden = !!paola;
    if (!paola) hint.textContent = 'La voce Paola non è installata su questo dispositivo: uso ' + sel.options[sel.selectedIndex].text +
      '. Su iPhone/Mac si scarica da Impostazioni › Accessibilità › Contenuto letto ad alta voce › Voci › Italiano.';
  }

  // Divide il digest in paragrafi da leggere, saltando link e fonti
  function buildChunks() {
    const els = content.querySelectorAll('h1, h2, h3, summary .t, p, li');
    const out = [];
    els.forEach(el => {
      if (el.closest('.sources')) return;
      if (el.tagName === 'P' && el.closest('li')) return;      // già letto con il suo elemento di lista
      const clone = el.cloneNode(true);
      clone.querySelectorAll('ul, ol').forEach(l => l.remove());  // le sottoliste si leggono a parte
      clone.querySelectorAll('a').forEach(a => {
        if (/^\s*(ascolta|fonte|fonti|link|scheda|qui|registrazione|video|audio)\s*$/i.test(a.textContent)) a.remove();
      });
      const num = clone.querySelector('.num');
      if (num) num.textContent = 'Tema ' + num.textContent + '. ';
      let text = clone.textContent
        .replace(/https?:\/\/\S+/g, '')
        .replace(/[()\[\]]\s*[()\[\]]/g, '')
        .replace(/\s+/g, ' ').trim();
      const label = el.querySelector(':scope > strong:first-child');
      if (label && el.tagName === 'P') text = text.replace(label.textContent, label.textContent + '. ');
      const minLetters = /^H[1-3]$/.test(el.tagName) ? 3 : 12;
      if (text.replace(/[^\p{L}]/gu, '').length < minLetters) return;   // righe fatte solo di link
      out.push({ el, text });
    });
    return out;
  }

  function setPlayingUI(on) {
    $('icoPlay').style.display = on ? 'none' : '';
    $('icoPause').style.display = on ? '' : 'none';
  }

  function highlight(idx) {
    content.querySelectorAll('.speaking').forEach(e => e.classList.remove('speaking'));
    const c = reader.chunks[idx];
    if (!c) return;
    const det = c.el.closest('details');
    if (det && !det.open) det.open = true;
    c.el.classList.add('speaking');
    c.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    $('pNow').textContent = c.text.slice(0, 90);
    $('pBar').style.width = ((idx + 1) / reader.chunks.length * 100) + '%';
  }

  function speakFrom(idx) {
    synth.cancel();
    reader.i = idx;
    if (idx >= reader.chunks.length) { stopReading(false); $('pNow').textContent = 'Lettura terminata'; return; }
    const u = new SpeechSynthesisUtterance(reader.chunks[idx].text);
    u.lang = 'it-IT';
    if (reader.voice) u.voice = reader.voice;
    u.rate = reader.rate;
    u.onend = () => { if (reader.playing && reader.i === idx) speakFrom(idx + 1); };
    u.onerror = e => { if (e.error !== 'interrupted' && e.error !== 'canceled' && reader.playing) speakFrom(idx + 1); };
    highlight(idx);
    reader.playing = true;
    setPlayingUI(true);
    synth.speak(u);
  }

  function pauseReading() {
    reader.playing = false;
    synth.cancel();            // più affidabile di pause() sui telefoni: riprende dal paragrafo corrente
    setPlayingUI(false);
  }

  function stopReading(close) {
    reader.playing = false;
    if (synth) synth.cancel();
    setPlayingUI(false);
    content.querySelectorAll('.speaking').forEach(e => e.classList.remove('speaking'));
    if (close) { player.classList.remove('open'); document.body.classList.remove('player-open'); }
  }

  function openPlayer() {
    if (!synth) { alert('Questo browser non supporta la lettura vocale.'); return; }
    fillVoices();
    reader.chunks = buildChunks();
    player.classList.add('open');
    document.body.classList.add('player-open');
    speakFrom(0);
  }

  if (synth) {
    synth.onvoiceschanged = () => { if (player.classList.contains('open')) fillVoices(); };
    const r = parseFloat(load('rate'));
    if (r) { reader.rate = r; $('pRate').value = String(r); }
  } else {
    listenBtn.style.display = 'none';
  }

  listenBtn.onclick = openPlayer;
  $('pPlay').onclick = () => reader.playing ? pauseReading() : speakFrom(reader.i);
  $('pNext').onclick = () => speakFrom(Math.min(reader.i + 1, reader.chunks.length - 1));
  $('pPrev').onclick = () => speakFrom(Math.max(reader.i - 1, 0));
  $('pClose').onclick = () => stopReading(true);
  $('pVoice').onchange = e => {
    reader.voice = italianVoices().find(v => v.name === e.target.value) || null;
    store('voice', e.target.value);
    if (reader.playing) speakFrom(reader.i);
  };
  $('pRate').onchange = e => {
    reader.rate = parseFloat(e.target.value) || 1;
    store('rate', String(reader.rate));
    if (reader.playing) speakFrom(reader.i);
  };
  // Tocca un paragrafo mentre il lettore è aperto per partire da lì
  content.addEventListener('click', e => {
    if (!player.classList.contains('open') || e.target.closest('a')) return;
    const idx = reader.chunks.findIndex(c => c.el.contains(e.target));
    if (idx >= 0) speakFrom(idx);
  });
  $('totop').onclick = () => window.scrollTo({ top: 0 });

  // Barra di lettura e pulsante "torna su"
  window.addEventListener('scroll', () => {
    const h = document.documentElement;
    const max = h.scrollHeight - h.clientHeight;
    $('progress').style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + '%';
    $('totop').classList.toggle('show', h.scrollTop > 600);
  }, { passive: true });

  init();
</script>
</body>
</html>
